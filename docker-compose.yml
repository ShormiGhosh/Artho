services:
  db:
    image: postgres:15-alpine
    container_name: artho_db
    environment:
      POSTGRES_USER: artho
      POSTGRES_PASSWORD: artho
      POSTGRES_DB: artho
    ports:
      - "5544:5432"
    volumes:
      - artho_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U artho"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  artho_pgdata:
