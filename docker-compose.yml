services:
  db:
    image: postgres:15-alpine
    container_name: moneyflow_db
    environment:
      POSTGRES_USER: moneyflow
      POSTGRES_PASSWORD: moneyflow
      POSTGRES_DB: moneyflow
    ports:
      - "5432:5432"
    volumes:
      - moneyflow_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U moneyflow"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  moneyflow_pgdata:
